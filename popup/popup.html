<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio Turbo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- 头部区域 -->
    <header class="header">
      <div class="header-brand">
        <img src="../icons/icon32.png" alt="Turbo Logo" class="brand-logo">
        <div class="brand-text">
          <h1 class="brand-title">AI Studio Turbo</h1>
          <span class="brand-subtitle">GPU 减负 & 流畅度优化</span>
        </div>
      </div>
      <!-- 总开关 -->
      <label class="switch" title="开启/关闭优化">
        <input type="checkbox" id="master-toggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- 模式选择器 -->
    <section class="section">
      <div class="section-label">优化模式</div>
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="turbo" id="btn-mode-turbo">
          <span class="mode-badge">推荐</span>
          <span class="mode-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </span>
          <span class="mode-name">Turbo 极速</span>
          <span class="mode-desc">均衡流畅</span>
        </button>
        <button class="mode-btn" data-mode="ultra" id="btn-mode-ultra">
          <span class="mode-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
              <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
              <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path>
              <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>
            </svg>
          </span>
          <span class="mode-name">Ultra 极致</span>
          <span class="mode-desc">极致降耗</span>
        </button>
        <button class="mode-btn" data-mode="custom" id="btn-mode-custom">
          <span class="mode-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="21" x2="4" y2="14"></line>
              <line x1="4" y1="10" x2="4" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12" y2="3"></line>
              <line x1="20" y1="21" x2="20" y2="16"></line>
              <line x1="20" y1="12" x2="20" y2="3"></line>
              <line x1="1" y1="14" x2="7" y2="14"></line>
              <line x1="9" y1="8" x2="15" y2="8"></line>
              <line x1="17" y1="16" x2="23" y2="16"></line>
            </svg>
          </span>
          <span class="mode-name">自定义</span>
          <span class="mode-desc">自由配置</span>
        </button>
      </div>
    </section>

    <!-- 自定义专项调节 (在自定义模式下可见) -->
    <section class="section custom-section" id="custom-options">
      <div class="section-label">自定义优化项目</div>
      
      <div class="option-item">
        <div class="option-info">
          <span class="option-title">消除毛玻璃模糊</span>
          <span class="option-desc">平替高斯模糊，杜绝界面重绘掉帧</span>
        </div>
        <label class="mini-switch">
          <input type="checkbox" id="opt-no-blur" checked>
          <span class="mini-slider"></span>
        </label>
      </div>

      <div class="option-item">
        <div class="option-info">
          <span class="option-title">冻结装饰动画</span>
          <span class="option-desc">停止循环光效微动，闲置零功耗</span>
        </div>
        <label class="mini-switch">
          <input type="checkbox" id="opt-no-anim" checked>
          <span class="mini-slider"></span>
        </label>
      </div>

      <div class="option-item">
        <div class="option-info">
          <span class="option-title">瞬时流式滚动</span>
          <span class="option-desc">禁用平滑滚动，消除逐字打字卡顿</span>
        </div>
        <label class="mini-switch">
          <input type="checkbox" id="opt-fast-scroll" checked>
          <span class="mini-slider"></span>
        </label>
      </div>

      <div class="option-item">
        <div class="option-info">
          <span class="option-title">零延迟交互过渡</span>
          <span class="option-desc">弹窗与菜单秒开秒合，响应零等待</span>
        </div>
        <label class="mini-switch">
          <input type="checkbox" id="opt-fast-transition" checked>
          <span class="mini-slider"></span>
        </label>
      </div>

      <div class="option-item">
        <div class="option-info">
          <span class="option-title">移除点击涟漪</span>
          <span class="option-desc">停用 Material 涟漪，按键更轻快</span>
        </div>
        <label class="mini-switch">
          <input type="checkbox" id="opt-no-ripple" checked>
          <span class="mini-slider"></span>
        </label>
      </div>

      <div class="option-item">
        <div class="option-info">
          <span class="option-title">精简渲染图层</span>
          <span class="option-desc">减少 GPU 合成层，降低显存占用</span>
        </div>
        <label class="mini-switch">
          <input type="checkbox" id="opt-reduce-layers" checked>
          <span class="mini-slider"></span>
        </label>
      </div>

      <div class="option-item">
        <div class="option-info">
          <span class="option-title">输入框圆润边框</span>
          <span class="option-desc">升级 24px 优雅大圆角，柔和美观</span>
        </div>
        <label class="mini-switch">
          <input type="checkbox" id="opt-rounded-prompt" checked>
          <span class="mini-slider"></span>
        </label>
      </div>
    </section>

    <!-- 底部区域 -->
    <footer class="footer">
      <button class="reset-btn" id="btn-reset">恢复默认预设</button>
      <span class="footer-tip">v1.0.0 · 修改即时生效</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
