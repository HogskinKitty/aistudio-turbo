<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio Turbo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- 头部区域 -->
    <header class="header">
      <div class="header-brand">
        <img src="../icons/icon32.png" alt="Turbo Logo" class="brand-logo">
        <div class="brand-text">
          <h1 class="brand-title">AI Studio Turbo</h1>
          <span class="brand-subtitle" data-i18n="subtitle">GPU 减负 & 流畅度优化</span>
        </div>
      </div>
      <div class="header-actions">
        <!-- 语言切换按钮 -->
        <button class="lang-btn" id="btn-lang" title="Switch Language / 切换语言">EN</button>
        <!-- 总开关 -->
        <label class="switch" id="master-toggle-label" title="开启/关闭优化" data-i18n-title="masterTitle">
          <input type="checkbox" id="master-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <!-- 模式选择器 -->
    <section class="section">
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="turbo" id="btn-mode-turbo">
          <span class="mode-badge" data-i18n="badgeRec">推荐</span>
          <div class="mode-head">
            <span class="mode-icon">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
              </svg>
            </span>
            <span class="mode-name" data-i18n="turboName">Turbo 极速</span>
          </div>
          <span class="mode-desc" data-i18n="turboDesc">均衡流畅</span>
        </button>
        <button class="mode-btn" data-mode="ultra" id="btn-mode-ultra">
          <div class="mode-head">
            <span class="mode-icon">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
                <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
                <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path>
                <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>
              </svg>
            </span>
            <span class="mode-name" data-i18n="ultraName">Ultra 极致</span>
          </div>
          <span class="mode-desc" data-i18n="ultraDesc">极致降耗</span>
        </button>
        <button class="mode-btn" data-mode="custom" id="btn-mode-custom">
          <div class="mode-head">
            <span class="mode-icon">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="21" x2="4" y2="14"></line>
                <line x1="4" y1="10" x2="4" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12" y2="3"></line>
                <line x1="20" y1="21" x2="20" y2="16"></line>
                <line x1="20" y1="12" x2="20" y2="3"></line>
                <line x1="1" y1="14" x2="7" y2="14"></line>
                <line x1="9" y1="8" x2="15" y2="8"></line>
                <line x1="17" y1="16" x2="23" y2="16"></line>
              </svg>
            </span>
            <span class="mode-name" data-i18n="customName">自定义</span>
          </div>
          <span class="mode-desc" data-i18n="customDesc">自由配置</span>
        </button>
      </div>
    </section>

    <!-- 自定义专项调节 (在自定义模式下可见) -->
    <section class="section custom-section" id="custom-options">
      <label class="option-item">
        <div class="option-info">
          <span class="option-title" data-i18n="noBlurTitle">消除毛玻璃模糊</span>
          <span class="option-desc" data-i18n="noBlurDesc">平替高斯模糊，杜绝界面重绘掉帧</span>
        </div>
        <span class="mini-switch">
          <input type="checkbox" id="opt-no-blur" checked>
          <span class="mini-slider"></span>
        </span>
      </label>

      <label class="option-item">
        <div class="option-info">
          <span class="option-title" data-i18n="noAnimTitle">冻结装饰动画</span>
          <span class="option-desc" data-i18n="noAnimDesc">停止循环光效微动，闲置零功耗</span>
        </div>
        <span class="mini-switch">
          <input type="checkbox" id="opt-no-anim" checked>
          <span class="mini-slider"></span>
        </span>
      </label>

      <label class="option-item">
        <div class="option-info">
          <span class="option-title" data-i18n="fastScrollTitle">瞬时流式滚动</span>
          <span class="option-desc" data-i18n="fastScrollDesc">禁用平滑滚动，消除逐字打字卡顿</span>
        </div>
        <span class="mini-switch">
          <input type="checkbox" id="opt-fast-scroll" checked>
          <span class="mini-slider"></span>
        </span>
      </label>

      <label class="option-item">
        <div class="option-info">
          <span class="option-title" data-i18n="fastTransitionTitle">零延迟交互过渡</span>
          <span class="option-desc" data-i18n="fastTransitionDesc">菜单抽屉秒开秒合，保留弹窗原生质感</span>
        </div>
        <span class="mini-switch">
          <input type="checkbox" id="opt-fast-transition" checked>
          <span class="mini-slider"></span>
        </span>
      </label>

      <label class="option-item">
        <div class="option-info">
          <span class="option-title" data-i18n="noRippleTitle">移除点击涟漪</span>
          <span class="option-desc" data-i18n="noRippleDesc">停用 Material 涟漪，按键更轻快</span>
        </div>
        <span class="mini-switch">
          <input type="checkbox" id="opt-no-ripple" checked>
          <span class="mini-slider"></span>
        </span>
      </label>

      <label class="option-item">
        <div class="option-info">
          <span class="option-title" data-i18n="reduceLayersTitle">精简渲染图层</span>
          <span class="option-desc" data-i18n="reduceLayersDesc">减少 GPU 合成层，降低显存占用</span>
        </div>
        <span class="mini-switch">
          <input type="checkbox" id="opt-reduce-layers" checked>
          <span class="mini-slider"></span>
        </span>
      </label>

      <label class="option-item">
        <div class="option-info">
          <span class="option-title" data-i18n="roundedPromptTitle">输入框圆润边框</span>
          <span class="option-desc" data-i18n="roundedPromptDesc">升级 24px 优雅大圆角，柔和美观</span>
        </div>
        <span class="mini-switch">
          <input type="checkbox" id="opt-rounded-prompt" checked>
          <span class="mini-slider"></span>
        </span>
      </label>
    </section>

    <!-- 底部区域 -->
    <footer class="footer">
      <button class="reset-btn" id="btn-reset" data-i18n="resetBtn">恢复默认预设</button>
      <span class="footer-tip" data-i18n="footerTip">v1.0.0 · 修改即时生效</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
